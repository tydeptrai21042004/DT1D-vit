_BASE_: ../base-finetune.yaml

DATA:
  NAME: "OxfordFlowers"
  DATAPATH: "/content/data/flowers-102"
  NUMBER_CLASSES: 102
  MULTILABEL: False
  FEATURE: "sup_vitb16_224"
  BATCH_SIZE: 64

MODEL:
  TYPE: "vit"
  TRANSFER_TYPE: "adapter"
  ADAPTER:
    NAME: "DT1D"
    DT1D:
      AXIS: "hw"
      GROUP_SIZE: 16
      DETAIL_BASIS: "orth"
      DETAIL_COMPONENTS: "offset4"
      CONTRAST_SPLIT: 8
      PROJECT_L1: True
      GATE_MODE: "learned"
      GATE_INIT: 0.01
      RESIDUAL_SCALE: 1.0
      PADDING: "replicate"
      USE_POINTWISE: False
      CACHE_KERNEL: False

SOLVER:
  TOTAL_EPOCH: 100
  BASE_LR: 5.0e-3
  WEIGHT_DECAY: 0.0001
  OPTIMIZER: "adamw"
  SCHEDULER: "cosine"
  WARMUP_EPOCH: 5
  LOG_EVERY_N: 10

RUN_N_TIMES: 3
OUTPUT_DIR: "outputs/dt1d_flowers"
